    .login-card { background: #1c2030; border: 1px solid #252d42; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; }
    .login-card h2 { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }
    .login-card p  { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    label  { display: block; font-size: 12px; font-weight: 500; color: #94a3b8; margin-bottom: 5px; }
    input, select, textarea { width: 100%; background: #111827; border: 1px solid #252d42; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; margin-bottom: 14px; font-family: inherit; }

    input[readonly] { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: linear-gradient(135deg,#f59e0b,#d97706); color: #0d1117; }
    .btn-danger  { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }

    .toggle-track { position: absolute; inset: 0; background: #1e293b; border-radius: 99px; cursor: pointer; transition: background 0.2s; border: 1px solid #252d42; }

    .toggle-switch input:checked + .toggle-track { background: rgba(52,211,153,0.2); border-color: rgba(52,211,153,0.4); }
    .toggle-switch input:checked + .toggle-track::after { left: 19px; background: #34d399; }
    .pricing-stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 24px; }

    .pricing-stat .val { font-size: 22px; font-weight: 800; color: #f59e0b; }

    .edit-pricing-form input, .edit-pricing-form select { margin-bottom: 10px; }
    .live-preview { background: #0d1117; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .live-preview .preview-label { font-size: 10px; color: #334155; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

    /* ── Custom Dialog System ─────────────────────────────────────────── */
    #sf-dialog-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0); display: flex; align-items: center; justify-content: center; padding: 20px; transition: background 0.2s ease; pointer-events: none; opacity: 0; }
    #sf-dialog-overlay.visible { background: rgba(0,0,0,0.72); pointer-events: all; opacity: 1; }
    #sf-dialog { background: #1c2030; border: 1px solid #252d42; border-radius: 16px; padding: 0; width: 100%; max-width: 420px; overflow: hidden; transform: scale(0.94) translateY(8px); transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), opacity 0.18s ease; opacity: 0; box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04); }
    #sf-dialog-overlay.visible #sf-dialog { transform: scale(1) translateY(0); opacity: 1; }
    .dlg-icon-bar { display: flex; align-items: center; justify-content: center; padding: 28px 28px 0; }
    .dlg-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .dlg-icon.danger  { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.25); }
    .dlg-icon.warning { background: rgba(251,146,60,0.12);  border: 1px solid rgba(251,146,60,0.25);  }
    .dlg-icon.info    { background: rgba(129,140,248,0.12); border: 1px solid rgba(129,140,248,0.25); }

    .dlg-body { padding: 18px 28px 24px; }

    .dlg-detail { margin-top: 14px; background: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #475569; line-height: 1.6; }
    .dlg-footer { display: flex; gap: 10px; padding: 0 28px 24px; }
    .dlg-divider { height: 1px; background: #1e293b; margin: 0; flex-shrink: 0; }
    .dlg-btn { flex: 1; border: none; border-radius: 10px; padding: 11px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s; font-family: inherit; }
    .dlg-btn:hover { opacity: 0.88; } .dlg-btn:active { transform: scale(0.97); }
    .dlg-btn.cancel { background: rgba(255,255,255,0.04); border: 1px solid #252d42; color: #64748b; }
    .dlg-btn.confirm-danger  { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; }
    .dlg-btn.confirm-warning { background: linear-gradient(135deg,#f59e0b,#d97706); color: #0d1117; }
    .dlg-btn.confirm-info    { background: rgba(129,140,248,0.15); border: 1px solid rgba(129,140,248,0.35); color: #818cf8; }

<body>

<div id="sf-dialog-overlay">
  <div id="sf-dialog">
    <div class="dlg-icon-bar"><div class="dlg-icon" id="dlg-icon"></div></div>
    <div class="dlg-body">
      <div class="dlg-title"  id="dlg-title"></div>
      <div class="dlg-msg"    id="dlg-msg"></div>
      <div class="dlg-detail" id="dlg-detail" style="display:none"></div>
    </div>
    <div class="dlg-divider"></div>
    <div class="dlg-footer" id="dlg-footer"></div>
  </div>
</div>

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CUSTOM DIALOG SYSTEM
═══════════════════════════════════════════════════════════════════════════ */
const DIALOG_ICONS = { danger:'🗑️', warning:'⚠️', info:'🔄', success:'✅' };
let _dialogResolve = null;

function _showDialog({ title, message, detail, variant='warning', confirmLabel='Confirm', cancelLabel='Cancel', confirmOnly=false }) {
  return new Promise(resolve => {
    _dialogResolve = resolve;
    const overlay = document.getElementById('sf-dialog-overlay');
    document.getElementById('dlg-icon').className = `dlg-icon ${variant}`;
    document.getElementById('dlg-icon').textContent = DIALOG_ICONS[variant] || '❓';
    document.getElementById('dlg-title').textContent = title;
    document.getElementById('dlg-msg').innerHTML = message;
    const det = document.getElementById('dlg-detail');
    if (detail) { det.innerHTML = detail; det.style.display = 'block'; } else { det.style.display = 'none'; }
    const footer = document.getElementById('dlg-footer');
    if (confirmOnly) {
      footer.innerHTML = `<button class="dlg-btn confirm-${variant}" onclick="_dlgResolve(true)">${confirmLabel}</button>`;
    } else {
      footer.innerHTML = `<button class="dlg-btn cancel" onclick="_dlgResolve(false)">${cancelLabel}</button><button class="dlg-btn confirm-${variant}" onclick="_dlgResolve(true)">${confirmLabel}</button>`;
    }
    overlay.classList.add('visible');
    overlay.onclick = e => { if (e.target === overlay) _dlgResolve(false); };
    document.addEventListener('keydown', _dlgEscape);
  });
}
function _dlgEscape(e) { if (e.key === 'Escape') _dlgResolve(false); }
function _dlgResolve(value) {
  document.removeEventListener('keydown', _dlgEscape);
  document.getElementById('sf-dialog-overlay').classList.remove('visible');
  document.getElementById('sf-dialog-overlay').onclick = null;
  if (_dialogResolve) { _dialogResolve(value); _dialogResolve = null; }
}
function sfConfirm(opts) { return _showDialog(opts); }
function sfAlert(opts)   { return _showDialog({ ...opts, confirmOnly: true, confirmLabel: opts.confirmLabel || 'OK' }); }


/* ═══════════════════════════════════════════════════════════════════════════
   APP STATE & API
═══════════════════════════════════════════════════════════════════════════ */
let SERVER_URL   = (function() {
  // When served by Express at /admin-panel, use same origin.
  // When opened as a local file (file://), fall back to localhost.
  if (window.location.protocol !== 'file:' && window.location.origin !== 'null') {
    return window.location.origin;
  }
  return 'http://localhost:5000';
})();
let ADMIN_SECRET = '';

let state = {
  authed: false, loading: false, stats: null,
  coupons: [], users: [], pagination: null,
  pricing: [], pricingRevenue: null,
  modal: null, editingCoupon: null, editingPlan: null, creatingPlan: false,
  msg: { text: '', type: '' },
  page: 'dashboard',
  // Users page state
  userSearch: '', userPage: 1, userFilter: 'all',
  // Auto-refresh timer
  autoRefreshTimer: null,
  // Cancellation requests
  cancellations: [],
  rejectModal: null,
};

// ── Restore session ─────────────────────────────────────────────────────────
(function restoreSession() {
  const saved = sessionStorage.getItem('sf_admin_session');
  if (!saved) return;
  try {
    const { secret, serverUrl } = JSON.parse(saved);
    if (!secret || !serverUrl) return;
    ADMIN_SECRET = secret; SERVER_URL = serverUrl;
    fetch(SERVER_URL + '/api/admin/stats', {
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
    }).then(r => {
      if (r.ok) { state.authed = true; loadPage('dashboard'); }
      else { sessionStorage.removeItem('sf_admin_session'); ADMIN_SECRET = ''; render(); }
    }).catch(() => { sessionStorage.removeItem('sf_admin_session'); ADMIN_SECRET = ''; render(); });
  } catch { sessionStorage.removeItem('sf_admin_session'); }
})();

function setState(patch) { Object.assign(state, patch); render(); }

// FIX (Bug 1 & 5): Safe encoding for user-supplied values.
// escapeHtml  → visible cell content
// escapeAttr  → values inside onclick="..." (JSON-encodes to a JS string literal)
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(str) {
  return JSON.stringify(String(str ?? ''));
}

async function api(method, path, body) {
  const res = await fetch(`${SERVER_URL}/api/admin${path}`, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || 'Request failed');
  return data;
}

function flash(text, type = 'success') {
  setState({ msg: { text, type } });

async function loadUsers(page, search, filter) {
  const p = page   !== undefined ? page   : state.userPage;
  const s = search !== undefined ? search : state.userSearch;
  const f = filter !== undefined ? filter : state.userFilter;
  const params = new URLSearchParams({ page: p, limit: 50 });
  if (s) params.set('search', s);
  if (f && f !== 'all') params.set('status', f);
  const d = await api('GET', `/users?${params}`);
  setState({ users: d.users ?? [], pagination: d.pagination, userPage: p, userSearch: s, userFilter: f });
}

async function loadPage(page) {
  // Stop auto-refresh when leaving dashboard
  if (state.autoRefreshTimer && page !== 'dashboard') {
    clearInterval(state.autoRefreshTimer);
    state.autoRefreshTimer = null;
  }
  setState({ page, loading: true });
  try {
    if (page === 'dashboard') {
      await loadStats();
      // Feature 4: Dashboard auto-refresh every 30s
      if (!state.autoRefreshTimer) {
        state.autoRefreshTimer = setInterval(() => loadStats(), 30_000);
      }
    }
    if (page === 'coupons')   await loadCoupons();
    if (page === 'users')     await loadUsers(1, '');
    if (page === 'broadcast') { /* static form, no data to load */ }
    if (page === 'pricing')        await loadPricing();
    if (page === 'cancellations')  await loadCancellations();
  } catch (e) { flash(e.message, 'error'); }
  setState({ loading: false });
}

async function handleLogin(e) {
  e.preventDefault();

function buildShareMessage(code) {
  return `🎓 Use code *${code}* to get a discount on StudyFlow AI Pro — your AI-powered study planner! 🚀 studyflow.ai`;

function toggleShareMenu(id, event) {
  event.stopPropagation();
  const menu = document.getElementById('share-menu-' + id);
  const btn  = event.currentTarget;
  if (!menu || !btn) return;

  const isOpen = menu.classList.contains('open');
  // Close all open share menus first
  document.querySelectorAll('.share-menu.open').forEach(m => m.classList.remove('open'));
  if (isOpen) return;

  // Position using fixed coords so it escapes any overflow:hidden ancestor
  const rect = btn.getBoundingClientRect();
  const menuW = 210;
  // Prefer aligning right edge to button right edge; flip left if off-screen
  let left = rect.right - menuW;
  if (left < 8) left = rect.left;
  // Show below the button; flip above if not enough space
  const spaceBelow = window.innerHeight - rect.bottom;
  const estimatedH = 220; // approx menu height
  let top;
  if (spaceBelow >= estimatedH || spaceBelow >= 120) {
    top = rect.bottom + 6;
  } else {
    top = rect.top - estimatedH - 6;
  }
  menu.style.left = left + 'px';
  menu.style.top  = top  + 'px';
  menu.classList.add('open');
}

// Close share menu when clicking outside
document.addEventListener('click', () => {
  document.querySelectorAll('.share-menu.open').forEach(m => m.classList.remove('open'));
});

async function shareCoupon(code, channel) {
  // Close the menu
  document.querySelectorAll('.share-menu.open').forEach(m => m.classList.remove('open'));
  const msg  = buildShareMessage(code);
  const enc  = encodeURIComponent(msg);

  if (channel === 'whatsapp') {
    window.open(`https://wa.me/?text=${enc}`, '_blank');
  } else if (channel === 'telegram') {
    window.open(`https://t.me/share/url?url=https://studyflow.ai&text=${enc}`, '_blank');
  } else if (channel === 'gmail') {
    const subject = encodeURIComponent(`🎓 StudyFlow AI Pro — Use code ${code}`);
    window.open(`https://mail.google.com/mail/?view=cm&su=${subject}&body=${enc}`, '_blank');
  } else if (channel === 'twitter') {
    window.open(`https://twitter.com/intent/tweet?text=${enc}`, '_blank');
  } else if (channel === 'copy') {
    try {
      await navigator.clipboard.writeText(msg);
      flash(`Share message for "${code}" copied to clipboard!`);
    } catch { flash('Could not copy to clipboard.', 'error'); }
  }
}

function couponStatus(c) {
  const exhausted = c.maxUses !== null && c.usedCount >= c.maxUses;
  const expired   = c.expiresAt && new Date() > new Date(c.expiresAt);
  if (!c.isActive)                                 return { label: 'Inactive',  cls: 'badge-red'    };
  if (exhausted || expired || c.isValid === false) return { label: 'Exhausted', cls: 'badge-orange' };
  return { label: 'Active', cls: 'badge-green' };
}

function useCell(c) {
  if (c.maxUses === null) return `<span style="color:#64748b">${c.usedCount} <span style="color:#334155">/ ∞</span></span>`;
  const pct = Math.min(100, Math.round((c.usedCount / c.maxUses) * 100));
  const rem = c.maxUses - c.usedCount;
  const barColor = pct >= 100 ? '#fb923c' : pct >= 75 ? '#f59e0b' : '#34d399';
  return `<div>
    <div class="use-bar-label"><strong style="color:#e2e8f0">${c.usedCount}</strong><span style="color:#475569"> / ${c.maxUses} users</span>${rem > 0 ? `<span style="color:#334155;margin-left:4px">(${rem} left)</span>` : ''}</div>
    <div class="use-bar-wrap"><div class="use-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
  </div>`;
}

function toDateInput(iso) {
  if (!iso) return '';
  try { return new Date(iso).toISOString().slice(0, 10); } catch { return ''; }
}

function statusBadge(status) {
  if (status === 'paid')    return `<span class="badge badge-green">✓ Paid</span>`;
  if (status === 'failed')  return `<span class="badge badge-red">✗ Failed</span>`;
  if (status === 'created') return `<span class="badge badge-blue">⏳ Created</span>`;
  return `<span class="badge badge-amber">${status}</span>`;
}

function getSubStatus(u) {
  if (!u.isPro) return { label: 'Free', cls: 'badge-indigo' };
  if (u.planType === 'lifetime' || !u.subscriptionExpiresAt) return { label: '♾️ Lifetime', cls: 'badge-amber' };
  const now = new Date();
  const exp = new Date(u.subscriptionExpiresAt);
  if (exp > now) return { label: '✅ Active', cls: 'badge-success' };
  return { label: '❌ Expired', cls: 'badge-red' };
}

async function loadPricing() {
  const [plans, rev] = await Promise.all([
    api('GET', '/pricing'),
    api('GET', '/pricing/revenue-by-plan').catch(() => ({ breakdown: [], totalTransactions: 0 })),
  ]);
  setState({ pricing: plans, pricingRevenue: rev });
}

function openEditPlan(id) {
  const plan = state.pricing.find(p => p._id === id);
  if (!plan) return;
  setState({ modal: 'edit-pricing', editingPlan: { ...plan } });
}

function openCreatePlan() {
  setState({ modal: 'create-pricing' });
}

async function saveEditPlan(e) {
  e.preventDefault();
  const f    = e.target;
  const plan = state.editingPlan;
  if (!plan) return;

  const pricePaise = Math.round(parseFloat(f.priceINR.value) * 100);
  const origRaw    = f.originalPriceINR.value.trim();
  const origPaise  = origRaw ? Math.round(parseFloat(origRaw) * 100) : null;

  if (isNaN(pricePaise) || pricePaise < 0)
    return flash('Price must be a valid non-negative number.', 'error');

  let durationDays = null;
  const isLifetime = f.isLifetime.checked;
  if (!isLifetime) {
    const raw = parseInt(f.durationDays ? f.durationDays.value : '0', 10);
    if (isNaN(raw) || raw < 1)
      return flash('Duration Days must be a positive whole number.', 'error');
    durationDays = raw;
  }

  const btn = f.querySelector('[type=submit]');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const updated = await api('PATCH', `/pricing/${plan._id}`, {
      name:               f.planName ? f.planName.value.trim() : (plan.name || plan.label),
      label:              f.label.value.trim(),
      pricePaise,
      originalPricePaise: origPaise,
      badge:              f.badge.value.trim(),
      description:        f.description.value.trim(),
      durationDays,
    });
    setState({
      modal: null, editingPlan: null,
      pricing: state.pricing.map(p => p._id === updated._id ? updated : p),
    });
    flash(`"${updated.name || updated.label}" plan updated!`);
  } catch (err) { flash(err.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '💾 Save Changes'; }
}

async function saveCreatePlan(e) {
  e.preventDefault();
  const f = e.target;

  const name       = f.planName.value.trim();
  const label      = f.label.value.trim() || name;
  const pricePaise = Math.round(parseFloat(f.priceINR.value) * 100);
  const origRaw    = f.originalPriceINR.value.trim();
  const origPaise  = origRaw ? Math.round(parseFloat(origRaw) * 100) : null;
  const isLifetime = f.isLifetime.checked;
  let durationDays = null;

  if (!name) return flash('Plan name is required.', 'error');
  if (isNaN(pricePaise) || pricePaise < 0) return flash('Price must be a valid non-negative number.', 'error');
  if (!isLifetime) {
    const raw = parseInt(f.durationDays ? f.durationDays.value : '0', 10);
    if (isNaN(raw) || raw < 1) return flash('Duration Days must be a positive whole number.', 'error');
    durationDays = raw;
  }

  const btn = f.querySelector('[type=submit]');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const created = await api('POST', '/pricing', {
      name, label, pricePaise,
      originalPricePaise: origPaise,
      badge:              f.badge.value.trim(),
      description:        f.description.value.trim(),
      durationDays,
      isEnabled:          true,
    });
    setState({ modal: null, pricing: [...state.pricing, created] });
    flash(`Plan "${created.name || created.label}" created!`);
  } catch (err) { flash(err.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '✅ Create Plan'; }
}

async function togglePlanEnabled(id, currentlyEnabled) {
  try {
    const updated = await api('PATCH', `/pricing/${id}`, { isEnabled: !currentlyEnabled });
    setState({ pricing: state.pricing.map(p => p._id === id ? updated : p) });
    flash(`Plan ${!currentlyEnabled ? 'enabled' : 'disabled'}.`);
  } catch (err) { flash(err.message, 'error'); }
}

async function deletePlan(id) {
  const plan = state.pricing.find(p => p._id === id);
  if (!plan) return;
  const ok = await sfConfirm({
    variant: 'danger',
    title: `Delete "${plan.name || plan.label || plan.planType}" plan?`,
    message: 'This will permanently remove the plan from the database.',
    detail: '⚠️ Cannot be undone. Existing subscribers are not affected.',
    confirmLabel: 'Yes, Delete', cancelLabel: 'Keep Plan',
  });
  if (!ok) return;
  try {
    await api('DELETE', `/pricing/${id}`);
    setState({ pricing: state.pricing.filter(p => p._id !== id) });
    flash('Plan deleted.');
  } catch (err) { flash(err.message, 'error'); }
}

async function resetPricingToDefaults() {
  const ok = await sfConfirm({
    variant: 'warning',
    title: 'Reset all prices to defaults?',
    message: 'This will restore all plan prices and settings to their factory defaults.',
    detail: '⚠️ Monthly: ₹499 · Annual: ₹2,999 · Lifetime: ₹199. This cannot be undone.',
    confirmLabel: 'Yes, Reset', cancelLabel: 'Keep Current',
  });
  if (!ok) return;
  try {
    const data = await api('POST', '/pricing/reset-defaults');
    flash('Pricing reset to defaults.');
    setState({ pricing: data.plans });
  } catch (err) { flash(err.message, 'error'); }
}

                </label>
              </div>

              <div class="plan-price">
                <sup>₹</sup>${Number(p.pricePaise / 100).toLocaleString('en-IN')}
              </div>
              ${p.originalPricePaise ? `<div class="plan-was">was ₹${Number(p.originalPricePaise / 100).toLocaleString('en-IN')}</div>` : '<div style="height:18px"></div>'}
              <div class="plan-desc">${escapeHtml(p.description || '—')}</div>
              <div style="font-size:11px;color:#475569;margin-bottom:10px">
                ⏱ Duration: <strong style="color:#94a3b8">${isLifetime ? '∞ Lifetime' : p.durationDays + ' days'}</strong>
              </div>
              <div style="background:#0d1117;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <div>
                  <div style="font-size:11px;color:#334155;margin-bottom:2px">REVENUE</div>
                  <div style="font-size:15px;font-weight:700;color:${color}">₹${r ? Number(r.totalINR).toLocaleString('en-IN') : '0'}</div>
                </div>
                <div>
                  <div style="font-size:11px;color:#334155;margin-bottom:2px">SALES</div>
                  <div style="font-size:15px;font-weight:700;color:${color}">${r ? r.count : 0}</div>
                </div>
                ${r && r.count > 0 ? `
                <div style="grid-column:1/-1">
                  <div style="font-size:11px;color:#334155;margin-bottom:2px">AVG AMOUNT</div>
                  <div style="font-size:13px;font-weight:600;color:#64748b">₹${Number(r.avgINR).toLocaleString('en-IN')}</div>
                </div>` : ''}
              </div>

              <div style="display:flex;gap:8px;align-items:center">
                <button class="btn btn-sm btn-indigo" style="flex:1" onclick="openEditPlan('${p._id}')">✏️ Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deletePlan('${p._id}')" title="Delete plan" style="padding:5px 10px">🗑</button>
                <span class="badge ${p.isEnabled ? 'badge-green' : 'badge-red'}" style="display:flex;align-items:center;padding:0 10px">
                  ${p.isEnabled ? '● Live' : '○ Hidden'}
                </span>
              </div>
            </div>`;
        }).join('')}
    </div>

    <div class="card">
      <div class="card-head">
        <h3>📊 Revenue Summary</h3>
        <span style="font-size:11px;color:#475569">${rev?.totalTransactions ?? 0} total paid transactions</span>
      </div>
      ${!rev || rev.breakdown.length === 0
        ? '<div class="empty">No paid transactions yet.</div>'
        : `<table>
            <thead><tr><th>Plan</th><th>Transactions</th><th>Total Revenue</th><th>Avg per Sale</th><th>Share</th></tr></thead>
            <tbody>
              ${rev.breakdown.map(b => {
                const totalAll = rev.breakdown.reduce((s, x) => s + parseFloat(x.totalINR), 0);
                const share    = totalAll > 0 ? Math.round((parseFloat(b.totalINR) / totalAll) * 100) : 0;
                const icon     = planIcons[b.planType ?? 'lifetime'] ?? '💳';
                const color    = planColors[b.planType ?? 'lifetime'] ?? '#818cf8';
                return `<tr>
                  <td><span style="font-weight:600;color:#f1f5f9">${icon} ${b.planType ?? 'lifetime'}</span></td>
                  <td>${b.count}</td>
                  <td><span class="badge badge-green">₹${Number(b.totalINR).toLocaleString('en-IN')}</span></td>
                  <td style="color:#64748b">₹${Number(b.avgINR).toLocaleString('en-IN')}</td>
                  <td>
                    <div style="display:flex;align-items:center;gap:8px">
                      <div style="flex:1;background:#1e293b;border-radius:99px;height:4px;overflow:hidden">
                        <div style="height:4px;border-radius:99px;background:${color};width:${share}%"></div>
                      </div>
                      <span style="font-size:11px;color:#475569;width:28px;text-align:right">${share}%</span>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`}
    </div>`;
}

/* shared inner fields for edit + create modals */

  const isLifetime = p ? (p.durationDays == null) : false;
  return `
    ${isCreate ? `
    <label>Plan Name <span style="color:#f87171">*</span></label>
    <input name="planName" placeholder="e.g. Quarterly, Student, Enterprise" required autocomplete="off" />
    <p class="hint" style="margin-top:-10px">Unique name — auto-converted to an internal identifier.</p>
    ` : `
    <label>Plan Name</label>
    <input name="planName" value="${p ? escapeHtml(p.name || p.label || p.planType) : ''}" placeholder="e.g. Monthly" />
    `}
    <label>Display Label</label>
    <input name="label" value="${p ? escapeHtml(p.label || p.name || p.planType) : ''}" placeholder="e.g. Monthly" />

    <div class="field-row">
      <div>
        <label>Price (₹ INR) <span style="color:#f87171">*</span></label>
        <input name="priceINR" type="number" min="0" step="1"
          value="${p ? (p.pricePaise / 100).toFixed(0) : ''}" required placeholder="199"
          oninput="document.getElementById('prev-price').textContent='₹'+Number(this.value||0).toLocaleString('en-IN')" />
        <p class="hint" style="margin-top:-6px">In Rupees — auto-converted to paise.</p>
      </div>
      <div>
        <label>Original Price (₹, blank = none)</label>
        <input name="originalPriceINR" type="number" min="0" step="1"
          value="${p && p.originalPricePaise ? (p.originalPricePaise / 100).toFixed(0) : ''}"
          placeholder="Strikethrough price"
          oninput="document.getElementById('prev-orig').textContent=this.value?'₹'+Number(this.value).toLocaleString('en-IN'):''" />
        <p class="hint" style="margin-top:-6px">Shown as "was ₹X" crossed out.</p>
      </div>
    </div>

    <label>Badge Text (blank = none)</label>
    <input name="badge" value="${p ? escapeHtml(p.badge || '') : ''}" placeholder='e.g. "Most Popular"'
      oninput="document.getElementById('prev-badge').innerHTML=this.value?'<span class=\\'plan-badge\\'>'+this.value+'</span>':''" />

    <label>Short Description</label>
    <input name="description" value="${p ? escapeHtml(p.description || '') : ''}"
      placeholder="Shown below the price on the paywall"
      oninput="document.getElementById('prev-desc').textContent=this.value" />

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#111827;border:1px solid #252d42;border-radius:8px;padding:10px 14px">
      <label class="toggle-switch" style="margin-bottom:0">
        <input type="checkbox" name="isLifetime" id="isLifetimeToggle"
          ${isLifetime ? 'checked' : ''}

        <span class="toggle-track"></span>
      </label>
      <div>
        <div style="font-size:13px;color:#e2e8f0;font-weight:500">Lifetime plan</div>
        <div style="font-size:11px;color:#475569">No expiry — durationDays will be null</div>
      </div>
    </div>

    <div id="durationField" style="display:${isLifetime ? 'none' : 'block'}">
      <label>Duration (days) <span style="color:#f87171">*</span></label>
      <input name="durationDays" type="number" min="1" step="1"
        value="${p && p.durationDays ? p.durationDays : ''}"
        placeholder="e.g. 30 for monthly, 365 for yearly" />
      <p class="hint" style="margin-top:-6px">Sets <code>subscriptionExpiresAt</code> on purchase. Affects new subscribers only.</p>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   CANCELLATION REQUESTS
═══════════════════════════════════════════════════════════════════════════ */
async function approveCancellation(id) {
  const ok = await sfConfirm({
    variant: 'danger',
    title: 'Approve Cancellation?',
    message: 'This will immediately revoke the user\'s Pro subscription.',
    detail: 'This action cannot be undone.',
    confirmLabel: 'Yes, Approve & Revoke',
    cancelLabel: 'Cancel',
  });
  if (!ok) return;
  try {
    await api('POST', `/cancellations/${id}/approve`);
    flash('Cancellation approved and subscription revoked.');
    await loadCancellations();
  } catch (err) { flash(err.message, 'error'); }
}

function openRejectModal(id) {
  setState({ modal: 'reject-cancel', rejectModal: { id, reason: '' } });
  setTimeout(() => {
    const el = document.getElementById('reject-reason-input');
    if (el) el.focus();
  }, 50);
}

async function submitReject() {
  const { id, reason } = state.rejectModal || {};
  if (!reason || !reason.trim()) { flash('A reason is required.', 'error'); return; }
  try {
    await api('POST', `/cancellations/${id}/reject`, { adminReason: reason.trim() });
    flash('Request rejected.');
    setState({ modal: null, rejectModal: null });
    await loadCancellations();
  } catch (err) { flash(err.message, 'error'); }
}

function extendSubModalHTML() {
  const { name } = state.editingCoupon || {};
  return `
    <div class="overlay" onclick="if(event.target===this)setState({modal:null})">
      <div class="modal" style="max-width:400px">
        <div class="modal-head">
          <h3>📅 Extend Subscription</h3>
          <button class="close-btn" onclick="setState({modal:null})">✕</button>
        </div>
        <div style="color:#94a3b8;font-size:13px;margin-bottom:16px">Extending for: <strong style="color:#f1f5f9">${escapeHtml(name||'')}</strong></div>
        <form onsubmit="submitExtend(event)">
          <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:16px">
            <div style="flex:1">
              <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px">Amount</label>
              <input name="extVal" type="number" min="1" value="1" required style="width:100%;margin:0" />
            </div>
            <div style="flex:1">
              <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px">Unit</label>
              <select name="extType" style="width:100%;margin:0;background:#1c2030;color:#f1f5f9;border:1px solid #252d42;border-radius:8px;padding:8px 10px">
                <option value="days">Days</option>
                <option value="months">Months</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button type="button" class="btn btn-ghost btn-sm" onclick="setState({modal:null})">Cancel</button>
            <button type="submit" class="btn btn-success btn-sm">✅ Extend</button>
          </div>
        </form>
      </div>
    </div>`;
}

function rejectCancelModalHTML() {
  const { id, reason } = state.rejectModal || {};
  return `
    <div class="overlay" onclick="if(event.target===this)setState({modal:null,rejectModal:null})">
      <div class="modal">
        <h3>✗ Reject Cancellation Request</h3>
        <div class="warn-box">You must provide a reason. This will be shown to the user in their settings.</div>
        <label>Reason for Rejection</label>
        <textarea id="reject-reason-input" rows="3" placeholder="e.g. You have already used AI features. Refunds are not applicable after usage."
          oninput="state.rejectModal={...state.rejectModal,reason:this.value}">${reason || ''}</textarea>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-ghost" onclick="setState({modal:null,rejectModal:null})">Cancel</button>
          <button class="btn btn-danger" onclick="submitReject()">Confirm Rejection</button>
        </div>
      </div>
    </div>`;
}

function cancellationsHTML() {
  const list = state.cancellations || [];
  const statusBadge = s =>
    s === 'pending'  ? '<span class="badge badge-amber">⏳ Pending</span>'
    : s === 'approved' ? '<span class="badge badge-green">✓ Approved</span>'
    : '<span class="badge badge-red">✗ Rejected</span>';

  const rows = list.length === 0
    ? `<tr><td colspan="7" class="empty">No cancellation requests found.</td></tr>`
    : list.map(r => {
        const u = r.userId || {};
        const snap = r.usageSnapshot || {};
        const schedUsed = snap.scheduleGenerated ? '<span class="badge badge-red">Yes</span>' : '<span class="badge badge-green">No</span>';
        const aiCount   = `<span style="font-weight:600;color:#818cf8">${snap.aiMessageCount ?? 0}</span>`;
        const planBadge = snap.planType
          ? `<span class="badge badge-indigo">${snap.planType}</span>` : '-';
        const reqDate = r.createdAt ? new Date(r.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '-';
        const subStart = snap.subscriptionStart
          ? new Date(snap.subscriptionStart).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '-';

        const actions = r.status === 'pending'
          ? `<div class="row-actions">
               <button class="btn btn-success btn-sm" onclick="approveCancellation('${r._id}')">Approve</button>
               <button class="btn btn-danger btn-sm" onclick="openRejectModal('${r._id}')">Reject</button>
             </div>`
          : r.status === 'rejected' && r.adminReason
            ? `<div style="font-size:11px;color:#f87171;max-width:200px">${r.adminReason}</div>`
            : '-';

        return `<tr>
          <td>
            <div style="font-weight:600;color:#f1f5f9">${u.name || 'Unknown'}</div>
            <div style="font-size:11px;color:#475569">${u.email || '-'}</div>
          </td>
          <td>${planBadge}</td>
          <td>${schedUsed}</td>
          <td>${aiCount} messages</td>
          <td><span style="font-size:11px;color:#64748b">${subStart}</span></td>
          <td>
            ${statusBadge(r.status)}
            <div style="font-size:10px;color:#334155;margin-top:3px">${reqDate}</div>
            ${r.reason ? `<div style="font-size:11px;color:#475569;margin-top:3px;font-style:italic">"${r.reason}"</div>` : ''}
          </td>
          <td>${actions}</td>
        </tr>`;
      }).join('');

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div class="section-title" style="margin:0">🔄 Cancellation Requests</div>
      <button class="btn btn-ghost btn-sm" onclick="loadCancellations()">↻ Refresh</button>
    </div>
    <div class="info-box">
      Review and action user cancellation/refund requests. Approving will immediately revoke their Pro subscription.
      Rejecting requires a reason which will be shown to the user.
    </div>
    <div class="card">
      <div class="card-head">
        <h3>All Requests <span style="color:#475569;font-weight:400">(${list.length})</span></h3>
        <div style="display:flex;gap:6px">
          <span class="badge badge-amber">Pending: ${list.filter(r=>r.status==='pending').length}</span>
          <span class="badge badge-green">Approved: ${list.filter(r=>r.status==='approved').length}</span>
          <span class="badge badge-red">Rejected: ${list.filter(r=>r.status==='rejected').length}</span>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Plan</th>
              <th>Schedule Used</th>
              <th>AI Messages</th>
              <th>Sub. Start</th>
              <th>Status / Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (!state.authed) { app.innerHTML = loginHTML(); return; }

  const flashMsg = state.msg.text
    ? `<div class="${state.msg.type==='error'?'error-box':'success-box'}" style="position:fixed;top:16px;right:16px;z-index:998;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.5)">${state.msg.text}</div>`
    : '';

  const pageContent =
    state.loading              ? '<div class="empty">Loading…</div>'
    : state.page==='dashboard' ? dashHTML()
    : state.page==='coupons'   ? couponsHTML()
    : state.page==='users'     ? usersHTML()
    : state.page==='broadcast' ? broadcastHTML()
    : state.page==='pricing'        ? pricingHTML()
    : state.page==='cancellations' ? cancellationsHTML()
    : '';

  let modal = '';
  if (state.modal === 'create-coupon')       modal = createCouponModalHTML();
  if (state.modal === 'edit-coupon')         modal = editCouponModalHTML();
  if (state.modal === 'coupon-redeemers')    modal = couponRedeemersModalHTML();
  if (state.modal === 'user-payments')       modal = userPaymentsModalHTML();
  if (state.modal === 'edit-pricing')        modal = editPricingModalHTML();
  if (state.modal === 'create-pricing')      modal = createPricingModalHTML();
  if (state.modal === 'reject-cancel')       modal = rejectCancelModalHTML();
  if (state.modal === 'extend-subscription') modal = extendSubModalHTML();

  const logoSVG = `<svg width="20" height="20" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><g stroke="#0d1117" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><polygon points="32,13 55,24.5 32,36 9,24.5" fill="#0d1117" stroke="#0d1117"/><path d="M19 30 v10 c0 5 13 8 13 8 s13-3 13-8 V30" fill="#0d1117" stroke="none"/><line x1="55" y1="24.5" x2="55" y2="38"/><circle cx="55" cy="41" r="3" fill="#0d1117" stroke="none"/></g></svg>`;

  app.innerHTML = `
    ${flashMsg}
    <div class="server-url-bar">🔗 Connected to: <span>${SERVER_URL}</span></div>
    <div class="shell">
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon">${logoSVG}</div>
          <div><div class="logo-text">StudyFlow AI</div><div class="logo-sub">Admin Panel</div></div>
        </div>
        ${navItem('dashboard','📊','Dashboard')}
        ${navItem('coupons','🏷️','Coupons')}
        ${navItem('pricing','💰','Pricing')}
        ${navItem('users','👥','Users')}
        ${navItem('broadcast','📣','Broadcast')}
        ${navItem('cancellations','🔄','Cancellations')}
        <div style="margin-top:auto;padding:20px;border-top:1px solid #1a2035;margin-top:24px">
          <div style="font-size:11px;color:#334155">Logged in as Admin</div>
          <button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%"
            onclick="if(state.autoRefreshTimer){clearInterval(state.autoRefreshTimer);state.autoRefreshTimer=null;}ADMIN_SECRET='';sessionStorage.removeItem('sf_admin_session');setState({authed:false,stats:null,coupons:[],users:[],pagination:null})">
            Sign Out
          </button>
        </div>
      </aside>
      <main class="main">${pageContent}</main>
    </div>
    ${modal}`;
}

document.addEventListener('DOMContentLoaded', render);
</script>
